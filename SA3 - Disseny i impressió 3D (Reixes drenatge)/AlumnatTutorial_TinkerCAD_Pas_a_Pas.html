<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutorial TinkerCAD — Reixa de Drenatge 3D · Pas a Pas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fira+Code:wght@400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B2A;--ink:#112233;--cyan:#00B4D8;--cyan2:#0077B6;--sky:#90E0EF;
  --amber:#F4A261;--ember:#E76F51;--sage:#52B788;--white:#FFFFFF;
  --card:#132235;--muted:#7CAFC2;--warn:#FDE68A;--err:#FCA5A5;
  --r:12px;--ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Syne',sans-serif;background:var(--navy);color:var(--white);min-height:100vh}

/* ── HEADER ─── */
header{
  background:var(--ink);border-bottom:2px solid var(--cyan2);
  padding:0 clamp(16px,4vw,48px);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;height:56px;
}
.brand{font-size:.85rem;font-weight:700;color:var(--sky);letter-spacing:.05em}
.prog-wrap{display:flex;align-items:center;gap:.7rem}
.prog-bar{width:160px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--sage));border-radius:3px;transition:width .4s var(--ease)}
.prog-txt{font-size:.72rem;color:var(--muted)}

/* ── SIDEBAR ─── */
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{
  width:240px;flex-shrink:0;background:var(--ink);
  border-right:1px solid rgba(255,255,255,.07);
  padding:1.2rem 0;position:sticky;top:56px;
  height:calc(100vh - 56px);overflow-y:auto;
}
.sidebar-title{font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);padding:.4rem 1.2rem .8rem}
.slink{
  display:flex;align-items:center;gap:.6rem;padding:.55rem 1.2rem;
  font-size:.8rem;cursor:pointer;border-left:3px solid transparent;
  transition:all .2s;color:rgba(255,255,255,.5);
}
.slink:hover{background:rgba(255,255,255,.04);color:var(--white)}
.slink.active{border-left-color:var(--cyan);color:var(--cyan);background:rgba(0,180,216,.06)}
.slink.done{color:var(--sage)}
.slink .snum{
  width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;
  display:flex;align-items:center;justify-content:center;font-size:.65rem;
  font-weight:700;flex-shrink:0;
}
.slink.done .snum{background:var(--sage);border-color:var(--sage);color:var(--white)}
.slink.done .snum::after{content:'✓'}
.slink.done .stxt{display:none}

/* ── MAIN ─── */
main{flex:1;padding:clamp(16px,3vw,40px);max-width:900px}

/* ── STEP CARD ─── */
.step-card{
  background:var(--card);border-radius:var(--r);border:1px solid rgba(255,255,255,.07);
  margin-bottom:2rem;overflow:hidden;scroll-margin-top:72px;
}
.step-header{
  display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.step-badge{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.9rem;font-weight:800;flex-shrink:0;
}
.step-meta{flex:1}
.step-tag{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:2px}
.step-title{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700}
.step-session{font-size:.72rem;color:var(--muted);background:rgba(255,255,255,.05);
  padding:3px 10px;border-radius:999px;white-space:nowrap}
.step-body{padding:1.4rem}

/* ── VISUAL MOCKUP ─── */
.mockup{
  background:#0A1828;border:1px solid rgba(0,180,216,.2);border-radius:8px;
  margin:1rem 0;overflow:hidden;
}
.mockup-bar{
  background:#091322;padding:6px 12px;display:flex;align-items:center;gap:.5rem;
  border-bottom:1px solid rgba(0,180,216,.15);font-size:.72rem;color:var(--muted);
}
.mockup-dot{width:10px;height:10px;border-radius:50%}
.mockup-svg{padding:1rem;display:block;width:100%}

/* ── INSTRUCTIONS ─── */
.inst-list{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.inst-item{
  display:flex;gap:.8rem;padding:.7rem .9rem;
  background:rgba(255,255,255,.03);border-radius:8px;cursor:pointer;
  border:1px solid rgba(255,255,255,.05);transition:all .2s;
}
.inst-item:hover{background:rgba(0,180,216,.06);border-color:rgba(0,180,216,.2)}
.inst-item.checked{background:rgba(82,183,136,.08);border-color:rgba(82,183,136,.25);opacity:.7}
.inst-chk{
  width:20px;height:20px;border-radius:4px;border:2px solid rgba(255,255,255,.25);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.75rem;transition:all .25s;margin-top:1px;
}
.inst-item.checked .inst-chk{background:var(--sage);border-color:var(--sage);color:white}
.inst-item.checked .inst-chk::after{content:'✓'}
.inst-txt{font-size:.88rem;line-height:1.5}
.inst-txt strong{color:var(--cyan)}
.inst-item.checked .inst-txt{text-decoration:line-through;opacity:.55}

/* ── TIPS ─── */
.tip{
  display:flex;gap:.7rem;padding:.7rem 1rem;border-radius:8px;
  margin:.6rem 0;font-size:.85rem;line-height:1.5;
}
.tip-info{background:rgba(0,119,182,.12);border:1px solid rgba(0,119,182,.3);color:#90CAF9}
.tip-warn{background:rgba(244,162,97,.1);border:1px solid rgba(244,162,97,.3);color:var(--warn)}
.tip-ok  {background:rgba(82,183,136,.1);border:1px solid rgba(82,183,136,.3);color:#86EFAC}
.tip-err {background:rgba(231,111,81,.1);border:1px solid rgba(231,111,81,.3);color:var(--err)}
.tip-ico{font-size:1.1rem;flex-shrink:0;margin-top:1px}

/* ── CODE ─── */
.code{
  background:#060F18;border:1px solid rgba(0,180,216,.2);border-radius:8px;
  font-family:'Fira Code',monospace;font-size:.8rem;padding:.9rem 1.1rem;
  margin:.6rem 0;line-height:1.7;overflow-x:auto;
}
.kw{color:#81C784}.num{color:#64B5F6}.str{color:#FFD54F}.cm{color:#4A7C59}

/* ── FORMULA ─── */
.formula{
  background:rgba(0,119,182,.1);border:1px solid rgba(0,119,182,.3);
  border-radius:8px;padding:1rem 1.2rem;margin:.6rem 0;font-family:'Fira Code',monospace;
  font-size:.88rem;color:#90CAF9;
}
.formula .result{color:var(--sage);font-weight:700;font-size:1rem}

/* ── COMPARE ─── */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.8rem 0}
.cmp-col{background:rgba(255,255,255,.03);border-radius:8px;padding:.9rem;border:1px solid rgba(255,255,255,.07)}
.cmp-head{font-size:.78rem;font-weight:700;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}

/* ── PARAMS TABLE ─── */
.ptable{width:100%;border-collapse:collapse;margin:.6rem 0;font-size:.85rem}
.ptable th{background:rgba(0,119,182,.2);color:var(--sky);text-align:left;padding:.5rem .7rem;font-size:.75rem;letter-spacing:.05em}
.ptable td{padding:.5rem .7rem;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.ptable tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.pval{color:var(--amber);font-weight:700;font-family:'Fira Code',monospace}

/* ── STEP COMPLETE BTN ─── */
.step-footer{padding:1rem 1.4rem;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
.btn-done{
  padding:.55rem 1.3rem;border-radius:999px;border:none;cursor:pointer;
  font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;
  background:var(--cyan2);color:white;transition:all .25s;
}
.btn-done:hover{background:var(--cyan)}
.btn-done.done{background:var(--sage)}
.step-pct{font-size:.75rem;color:var(--muted)}

/* ── FINAL BOX ─── */
.final-box{
  background:linear-gradient(135deg,rgba(0,119,182,.2),rgba(82,183,136,.1));
  border:1px solid rgba(0,180,216,.3);border-radius:var(--r);
  padding:2rem;text-align:center;margin-bottom:2rem;
}
</style>
</head>

<div class="layout">
<nav class="sidebar" id="sidebar">

</nav>

<main id="main"></main>
</div>

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
const completed = new Set();
let stepChecks = {};

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  STEPS.forEach((s,i) => {
    const el = document.createElement('div');
    el.className = 'slink';
    el.id = 'sl'+i;
    el.innerHTML = `<div class="snum">${i+1}</div><span class="stxt">${s.title}</span>`;
    el.onclick = () => document.getElementById(s.id).scrollIntoView({behavior:'smooth'});
    sb.appendChild(el);
  });
}

function buildSteps() {
  const main = document.getElementById('main');
  STEPS.forEach((s,i) => {
    stepChecks[i] = 0;
    const el = document.createElement('div');
    el.className = 'step-card';
    el.id = s.id;
    el.innerHTML = `
      <div class="step-header">
        <div class="step-badge" style="background:${s.color}20;border:2px solid ${s.color};color:${s.color}">${i+1}</div>
        <div class="step-meta">
          <div class="step-tag">${s.tag}</div>
          <div class="step-title">${s.title}</div>
        </div>
        <div class="step-session">${s.session}</div>
      </div>
      <div class="step-body">
        <div class="mockup">
          <div class="mockup-bar">
            <div class="mockup-dot" style="background:#EF5350"></div>
            <div class="mockup-dot" style="background:#FFA726"></div>
            <div class="mockup-dot" style="background:#66BB6A"></div>
            <span>TinkerCAD · Pas ${i+1}: ${s.title}</span>
          </div>
          ${MOCKUPS[s.mockup]||''}
        </div>
        ${s.formula ? `<div class="formula"><strong>${s.formula.left}:</strong> <span class="result">${s.formula.right}</span><br><small style="opacity:.6">${s.formula.note}</small></div>` : ''}
        <ul class="inst-list" id="il${i}">
          ${s.instructions.map((ins,j)=>`
            <li class="inst-item" onclick="toggleCheck(${i},${j},this)">
              <div class="inst-chk"></div>
              <span class="inst-txt">${ins.t}</span>
            </li>`).join('')}
        </ul>
        ${s.tips.map(t=>`<div class="tip tip-${t.type}"><span class="tip-ico">${t.ico}</span><span>${t.t}</span></div>`).join('')}
        ${s.params ? `
          <table class="ptable">
            <thead><tr><th>Paràmetre</th><th>Valor recomanat</th></tr></thead>
            <tbody>${s.params.map(p=>`<tr><td>${p.p}</td><td class="pval">${p.v}</td></tr>`).join('')}</tbody>
          </table>` : ''}
      </div>
      <div class="step-footer">
        <span class="step-pct" id="pct${i}">0 / ${s.instructions.length} completats</span>
        <button class="btn-done" id="bd${i}" onclick="markDone(${i})">Marcar pas com a completat</button>
      </div>`;
    main.appendChild(el);
  });

  // Final box
  main.insertAdjacentHTML('beforeend', `
    <div class="final-box" id="finalBox" style="display:none">
      <div style="font-size:2.5rem;margin-bottom:.8rem">🎉</div>
      <h2 style="font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--cyan);margin-bottom:.5rem">Tutorial completat!</h2>
      <p style="opacity:.7;margin-bottom:1.2rem">Has aprés a modelar una reixa 3D completa. El teu STL està llest per a imprimir.</p>
      <p style="color:var(--sage);font-size:.95rem">Següent pas: obri <strong>Ultimaker Cura</strong>, importa el fitxer STL i configura els paràmetres de laminat.</p>
    </div>`);
}

function toggleCheck(stepIdx, itemIdx, el) {
  el.classList.toggle('checked');
  const total = STEPS[stepIdx].instructions.length;
  const done = document.querySelectorAll(`#il${stepIdx} .inst-item.checked`).length;
  stepChecks[stepIdx] = done;
  document.getElementById(`pct${stepIdx}`).textContent = `${done} / ${total} completats`;
  updateProgress();
}

function markDone(i) {
  completed.has(i) ? completed.delete(i) : completed.add(i);
  const btn = document.getElementById('bd'+i);
  const sl  = document.getElementById('sl'+i);
  if (completed.has(i)) {
    btn.textContent = '✓ Completat!'; btn.classList.add('done');
    sl.classList.add('done'); sl.classList.remove('active');
    // Check all items
    document.querySelectorAll(`#il${i} .inst-item`).forEach(el => el.classList.add('checked'));
    stepChecks[i] = STEPS[i].instructions.length;
    document.getElementById(`pct${i}`).textContent = `${STEPS[i].instructions.length} / ${STEPS[i].instructions.length} completats`;
  } else {
    btn.textContent = 'Marcar pas com a completat'; btn.classList.remove('done');
    sl.classList.remove('done');
  }
  updateProgress();
  if (completed.size === STEPS.length) document.getElementById('finalBox').style.display = 'block';
}

function updateProgress() {
  const pct = Math.round((completed.size / STEPS.length) * 100);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progTxt').textContent = `${completed.size} / ${STEPS.length} passos`;
}

// Active sidebar link on scroll
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const idx = STEPS.findIndex(s => s.id === e.target.id);
      document.querySelectorAll('.slink').forEach((el,i) => el.classList.toggle('active', i===idx && !completed.has(idx)));
    }
  });
}, { threshold:.3 });

buildSidebar();
buildSteps();
STEPS.forEach(s => { const el = document.getElementById(s.id); if(el) observer.observe(el); });
</script>
</body>
